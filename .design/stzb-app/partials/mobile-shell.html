<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>率土之滨 · 监控 App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    /* 设备外框：iPhone-like，44px 圆角，柔和外阴影 */
    .device-frame {
      width: 390px;
      max-width: 390px;
      height: 844px;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 40px 90px rgba(46, 79, 166, 0.20), 0 8px 24px rgba(20, 34, 58, 0.10);
    }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 1; }
      50%  { transform: scale(1.35); opacity: 0.55; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .live-dot { animation: pulse 1.8s ease-in-out infinite; }
    /* Tab 项 active 态：由叶子页在对应 <a> 设 data-active="true" 驱动 */
    [data-tab-item] .tab-pill { display: none; }
    [data-tab-item][data-active="true"] .tab-pill { display: block; }
    [data-tab-item] .tab-ico, [data-tab-item] .tab-lbl { color: var(--text-tertiary); }
    [data-tab-item][data-active="true"] .tab-ico, [data-tab-item][data-active="true"] .tab-lbl { color: var(--color-primary); }
    .tabnum { font-variant-numeric: tabular-nums; }
  </style>
</head>

<body class="app-bg min-h-screen flex items-center justify-center p-6">

  <!-- ===== 移动设备外框 ===== -->
  <div class="device-frame app-bg">

    <!-- ===== 顶部 iOS 状态栏 ===== -->
    <div class="flex items-center justify-between px-6" style="height: 44px;">
      <span class="type-caption tabnum" style="font-weight: 600; color: var(--text-primary);">9:41</span>
      <div class="flex items-center gap-1.5" style="color: var(--text-primary);">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor" aria-hidden="true">
          <rect x="0" y="9" width="3" height="5" rx="1"></rect>
          <rect x="5" y="6" width="3" height="8" rx="1"></rect>
          <rect x="10" y="3" width="3" height="11" rx="1"></rect>
          <rect x="15" y="0" width="3" height="14" rx="1"></rect>
        </svg>
        <svg width="18" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 8.5a15 15 0 0 1 20 0"></path>
          <path d="M5 12a10 10 0 0 1 14 0"></path>
          <path d="M8.5 15.5a5 5 0 0 1 7 0"></path>
          <circle cx="12" cy="19" r="0.6" fill="currentColor"></circle>
        </svg>
        <svg width="26" height="14" viewBox="0 0 26 14" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="13" rx="3.5" stroke="currentColor" stroke-opacity="0.4"></rect>
          <rect x="2.5" y="2.5" width="15" height="9" rx="2" fill="currentColor"></rect>
          <rect x="23" y="4.5" width="2" height="5" rx="1" fill="currentColor" fill-opacity="0.4"></rect>
        </svg>
      </div>
    </div>

    <!-- ===== 玻璃头部 MacGlassHeader（SLOT: pageHeader） ===== -->
    <!-- SLOT: pageHeader -->
    <header class="glass-veil mx-4 mt-1 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <!-- 可选返回按钮：详情/二级页填入 -->
        <div class="flex flex-col">
          <span class="type-title" style="color: var(--text-primary);">页面标题</span>
          <span class="type-caption" style="color: var(--text-tertiary);">副标题占位</span>
        </div>
      </div>
      <div class="flex items-center gap-3" style="color: var(--text-secondary);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
          <path d="M21 4v5h-5"></path>
        </svg>
      </div>
    </header>
    <!-- /SLOT: pageHeader -->

    <!-- ===== 主内容滚动区（SLOT: pageContent） ===== -->
    <main class="no-scrollbar flex flex-col overflow-y-auto"
          style="height: calc(844px - 44px - 64px); padding: 16px; gap: 16px; padding-bottom: 96px;">
      <!-- SLOT: pageContent -->
      <!-- /SLOT: pageContent -->
    </main>

    <!-- ===== 底部玻璃浮层 Tab 栏（战场 / 战报 / 同盟 / 工具） ===== -->
    <!-- SLOT: activeTab（叶子页面在对应 tab 上设置 data-active="true"，并保留 data-tab-key） -->
    <nav class="glass-floating absolute left-3 right-3" style="bottom: 10px; padding: 8px 8px 6px;">
      <div class="flex items-stretch justify-between">

        <!-- Tab 1：战场（雷达） -->
        <a href="#" data-dom-id="tab-battlefield" data-tab-key="battlefield" data-tab-item data-active="true"
           class="flex flex-1 flex-col items-center gap-1 py-1.5 rounded-2xl relative">
          <span class="tab-pill absolute inset-x-2 inset-y-0 rounded-2xl" style="background: var(--color-primary-container);"></span>
          <svg class="tab-ico relative" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="12" cy="12" r="5"></circle>
            <circle cx="12" cy="12" r="1.4" fill="currentColor"></circle>
            <path d="M12 12 20 6"></path>
          </svg>
          <span class="tab-lbl type-caption relative">战场</span>
        </a>

        <!-- Tab 2：战报（收据） -->
        <a href="#" data-dom-id="tab-reports" data-tab-key="reports" data-tab-item
           class="flex flex-1 flex-col items-center gap-1 py-1.5 rounded-2xl relative">
          <span class="tab-pill absolute inset-x-2 inset-y-0 rounded-2xl" style="background: var(--color-primary-container);"></span>
          <svg class="tab-ico relative" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"></path>
            <path d="M9 8h6"></path>
            <path d="M9 12h6"></path>
          </svg>
          <span class="tab-lbl type-caption relative">战报</span>
        </a>

        <!-- Tab 3：同盟（人群） -->
        <a href="#" data-dom-id="tab-alliance" data-tab-key="alliance" data-tab-item
           class="flex flex-1 flex-col items-center gap-1 py-1.5 rounded-2xl relative">
          <span class="tab-pill absolute inset-x-2 inset-y-0 rounded-2xl" style="background: var(--color-primary-container);"></span>
          <svg class="tab-ico relative" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="8" r="3"></circle>
            <path d="M4 19c0-2.8 2.2-5 5-5s5 2.2 5 5"></path>
            <circle cx="17" cy="9" r="2.4"></circle>
            <path d="M15.5 14.4c2.3.2 4 1.9 4 4.1"></path>
          </svg>
          <span class="tab-lbl type-caption relative">同盟</span>
        </a>

        <!-- Tab 4：工具（三点） -->
        <a href="#" data-dom-id="tab-tools" data-tab-key="tools" data-tab-item
           class="flex flex-1 flex-col items-center gap-1 py-1.5 rounded-2xl relative">
          <span class="tab-pill absolute inset-x-2 inset-y-0 rounded-2xl" style="background: var(--color-primary-container);"></span>
          <svg class="tab-ico relative" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="5" cy="12" r="1.6" fill="currentColor"></circle>
            <circle cx="12" cy="12" r="1.6" fill="currentColor"></circle>
            <circle cx="19" cy="12" r="1.6" fill="currentColor"></circle>
          </svg>
          <span class="tab-lbl type-caption relative">工具</span>
        </a>
      </div>

      <div class="flex justify-center pt-1.5 pb-0.5">
        <span class="rounded-full" style="width: 134px; height: 5px; background: var(--text-tertiary); opacity: 0.55;"></span>
      </div>
    </nav>

  </div>
</body>
</html>
