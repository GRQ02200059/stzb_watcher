<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 率土之滨监控</title>
    <style id="theme-vars">
/* ==========================================================================
   STZB Watcher — Mobile UI (macOS Liquid Glass)
   配色完全沿用安卓端 AstzbColors：浅雾背景 + 彩色环境光 + 半透明玻璃
   ========================================================================== */

:root {
  /* 页面背景：接近 macOS 桌面雾白 */
  --bg-top: #FBFCFF;
  --bg-middle: #F1F6FF;
  --bg-bottom: #E9F1FC;

  /* 环境光斑（穿过玻璃后的蓝 / 紫 / 青 / 桃泛光） */
  --aurora-blue: rgba(140, 200, 255, 0.40);
  --aurora-violet: rgba(201, 155, 255, 0.40);
  --aurora-mint: rgba(114, 228, 214, 0.32);
  --aurora-peach: rgba(255, 210, 184, 0.24);

  /* 玻璃表面：半透明白（层级） */
  --glass-veil: rgba(255, 255, 255, 0.45);
  --glass-frost: rgba(255, 255, 255, 0.72);
  --glass-floating: rgba(255, 255, 255, 0.85);
  --glass-highlight: rgba(255, 255, 255, 0.85);

  /* 主色 */
  --color-primary: #426AD2;
  --color-primary-600: #375DBF;
  --color-primary-700: #2E4FA6;
  --color-primary-container: #EAF1FF;
  --color-on-primary: #FFFFFF;

  /* 文字 */
  --text-primary: #14223A;
  --text-secondary: #60708B;
  --text-tertiary: #8A99B0;

  /* 线框 */
  --outline: rgba(255, 255, 255, 0.75);
  --outline-low: rgba(255, 255, 255, 0.55);
  --outline-blue: rgba(66, 106, 210, 0.14);
  --hairline: rgba(20, 34, 58, 0.08);

  /* 语义色（仅状态语义使用） */
  --state-success: #1E9B83;
  --state-warning: #BE7A18;
  --state-error: #C75862;
  --state-info: #4C78C8;

  --state-success-bg: #E0F4EE;
  --state-warning-bg: #FDECD4;
  --state-error-bg: #F9E2E5;
  --state-info-bg: #E3ECF9;

  /* 圆角（克制刻度） */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 26px;
  --radius-full: 9999px;

  /* 阴影：静态卡片走边框/表面分层，仅浮层可深 */
  --shadow-card: 0 1px 2px rgba(20, 34, 58, 0.04);
  --shadow-float: 0 18px 48px rgba(46, 79, 166, 0.18);

  /* 字体 */
  --font-sans: -apple-system, "SF Pro SC", "SF Pro Text", "PingFang SC",
    "Helvetica Neue", "Noto Sans SC", system-ui, sans-serif;
}

* { box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 字号刻度（对齐 AstzbTypography） */
.type-display { font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.01em; }
.type-title   { font-size: 18px; line-height: 24px; font-weight: 600; }
.type-body-lg { font-size: 16px; line-height: 24px; font-weight: 400; }
.type-body    { font-size: 14px; line-height: 20px; font-weight: 400; }
.type-label   { font-size: 14px; line-height: 20px; font-weight: 600; }
.type-caption { font-size: 12px; line-height: 16px; font-weight: 500; }

/* ---- 玻璃基础组件 ---- */
.glass-card {
  background: var(--glass-frost);
  border: 1px solid var(--outline);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
}
.glass-veil {
  background: var(--glass-veil);
  border: 1px solid var(--outline-low);
  border-radius: var(--radius-md);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
}
.glass-floating {
  background: var(--glass-floating);
  border: 1px solid var(--outline);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-float);
  backdrop-filter: blur(30px) saturate(160%);
  -webkit-backdrop-filter: blur(30px) saturate(160%);
}

/* 页面雾白 + 环境光背景 */
.app-bg {
  background:
    radial-gradient(120% 90% at 12% 4%, var(--aurora-blue) 0%, transparent 46%),
    radial-gradient(120% 90% at 92% 8%, var(--aurora-violet) 0%, transparent 48%),
    radial-gradient(140% 80% at 80% 96%, var(--aurora-mint) 0%, transparent 52%),
    radial-gradient(120% 90% at 8% 92%, var(--aurora-peach) 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-top) 0%, var(--bg-middle) 52%, var(--bg-bottom) 100%);
}

/* 状态胶囊 */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; line-height: 16px; }
.chip-success { background: var(--state-success-bg); color: var(--state-success); }
.chip-warning { background: var(--state-warning-bg); color: var(--state-warning); }
.chip-error   { background: var(--state-error-bg); color: var(--state-error); }
.chip-info    { background: var(--state-info-bg); color: var(--state-info); }

/* 滚动条隐藏（移动端预览更干净） */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="app-bg min-h-screen flex items-center justify-center p-6">

      <!-- ===== 移动设备外框（390×844，全屏登录，无底部 Tab / 无 MacGlassHeader） ===== -->
      <div class="device-frame app-bg">

        <!-- ===== 顶部 iOS 状态栏 ===== -->
        <div class="flex items-center justify-between px-6" style="height: 44px;">
          <span class="type-caption tnum" style="font-weight: 600; color: var(--text-primary);">9:41</span>
          <div class="flex items-center gap-1.5" style="color: var(--text-primary);">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor" aria-hidden="true">
              <rect x="0" y="9" width="3" height="5" rx="1"></rect>
              <rect x="5" y="6" width="3" height="8" rx="1"></rect>
              <rect x="10" y="3" width="3" height="11" rx="1"></rect>
              <rect x="15" y="0" width="3" height="14" rx="1"></rect>
            </svg>
            <svg width="18" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 8.5a15 15 0 0 1 20 0"></path>
              <path d="M5 12a10 10 0 0 1 14 0"></path>
              <path d="M8.5 15.5a5 5 0 0 1 7 0"></path>
              <circle cx="12" cy="19" r="0.6" fill="currentColor"></circle>
            </svg>
            <svg width="26" height="14" viewBox="0 0 26 14" fill="none" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="13" rx="3.5" stroke="currentColor" stroke-opacity="0.4"></rect>
              <rect x="2.5" y="2.5" width="15" height="9" rx="2" fill="currentColor"></rect>
              <rect x="23" y="4.5" width="2" height="5" rx="1" fill="currentColor" fill-opacity="0.4"></rect>
            </svg>
          </div>
        </div>

        <!-- ===== 全屏内容：整体居中 ===== -->
        <div class="no-scrollbar flex flex-col items-center justify-center overflow-y-auto px-5"
             style="height: calc(844px - 44px); padding-top: 20px; padding-bottom: 24px;">

          <!-- 玻璃浮层登录卡 -->
          <section class="glass-floating w-full" style="max-width: 340px; padding: 26px 22px;">

            <!-- 品牌头部：玻璃圆形 App 图标（雷达）+ 名称 + 标语 -->
            <div class="flex flex-col items-center text-center">
              <div class="glass-veil relative flex items-center justify-center"
                   style="width: 68px; height: 68px; border-radius: var(--radius-full);">
                <span class="radar-ping absolute" aria-hidden="true"
                      style="width: 68px; height: 68px; border-radius: var(--radius-full); border: 1.5px solid var(--color-primary);"></span>
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"></circle>
                  <circle cx="12" cy="12" r="5"></circle>
                  <circle cx="12" cy="12" r="1.4" fill="var(--color-primary)"></circle>
                  <path d="M12 12 20 6"></path>
                </svg>
              </div>
              <h1 class="type-display mt-4" style="color: var(--text-primary);">率土之滨 · 本机监控</h1>
              <p class="type-caption mt-1.5" style="color: var(--text-secondary);">本机抓包 · 战报同盟排行一站分析</p>
            </div>

            <!-- 表单 -->
            <form class="mt-6 flex flex-col gap-4" onsubmit="return false;">
              <div class="flex flex-col gap-1.5">
                <label class="type-label" for="login-username" style="color: var(--text-secondary);">用户名</label>
                <input id="login-username" name="username" type="text" autocomplete="username"
                       class="field-input tnum" placeholder="请输入用户名" />
              </div>
              <div class="flex flex-col gap-1.5">
                <label class="type-label" for="login-password" style="color: var(--text-secondary);">密码</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password"
                       class="field-input" placeholder="请输入密码" />
              </div>

              <!-- 主按钮：登录 -->
              <button type="submit" data-dom-id="btn-login-submit"
                      class="btn-primary mt-1 flex items-center justify-center gap-2 type-label"
                      style="height: 48px; width: 100%; color: var(--color-on-primary); background: var(--color-primary); border-radius: var(--radius-lg); border: none; cursor: pointer;">
                <span>登录</span>
                <svg class="btn-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14"></path>
                  <path d="m13 6 6 6-6 6"></path>
                </svg>
              </button>
            </form>

            <!-- 切换：注册 -->
            <div class="mt-4 flex items-center justify-center gap-1 type-caption" style="color: var(--text-secondary);">
              <span>没有账号？</span>
              <a href="#" class="link-primary" style="color: var(--color-primary); font-weight: 600;">注册</a>
            </div>
          </section>

          <!-- 免费声明面板 -->
          <div class="mt-4 flex w-full items-start gap-2.5 px-3.5 py-3"
               style="max-width: 340px; background: var(--color-primary-container); border-radius: var(--radius-md);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;">
              <path d="M12 22c5-2.2 8-6 8-11V6l-8-3-8 3v5c0 5 3 8.8 8 11z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <p class="type-caption" style="color: var(--color-primary-700); line-height: 18px;">
              本工具完全免费，禁止倒卖。仅用于本机数据分析，请勿用于任何商业交易。
            </p>
          </div>

          <!-- 底部辅助：服务公告 + GitHub star/fork -->
          <div class="mt-4 flex w-full flex-col items-center gap-2" style="max-width: 340px;">
            <p class="type-caption text-center" style="color: var(--text-tertiary); line-height: 16px;">
              服务公告：抓包节点已升级，登录后即可查看实时战场
            </p>
            <div class="flex items-center gap-4 type-caption tnum" style="color: var(--text-tertiary);">
              <span class="flex items-center gap-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m12 3 2.6 5.6 6 .7-4.5 4 1.3 6-5.4-3.1L6.6 19l1.3-6L3.4 9l6-.7z"></path>
                </svg>
                <span>Star 1.2k</span>
              </span>
              <span class="flex items-center gap-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="6" cy="5" r="2.2"></circle>
                  <circle cx="18" cy="5" r="2.2"></circle>
                  <circle cx="12" cy="19" r="2.2"></circle>
                  <path d="M6 7.2v3c0 1.2 1 2.2 2.2 2.2h7.6c1.2 0 2.2-1 2.2-2.2v-3"></path>
                  <path d="M12 12.4v4.4"></path>
                </svg>
                <span>Fork 236</span>
              </span>
            </div>
          </div>

        </div>
      </div>
    </main>

    <!-- ===== 页面私有样式：设备框 + 交互态（放置于 body 末尾，避免被 --replace-head 清除） ===== -->
    <style>
      /* 设备外框：iPhone-like，44px 圆角，柔和外阴影 */
      .device-frame {
        width: 390px;
        max-width: 390px;
        height: 844px;
        border-radius: 44px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 40px 90px rgba(46, 79, 166, 0.20), 0 8px 24px rgba(20, 34, 58, 0.10);
      }
      .tnum { font-variant-numeric: tabular-nums; }

      /* 输入框：玻璃白底，聚焦主蓝描边 */
      .field-input {
        width: 100%;
        height: 48px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-md);
        padding: 0 14px;
        font-size: 15px;
        color: var(--text-primary);
        transition: border-color .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s cubic-bezier(.2,.8,.2,1);
      }
      .field-input::placeholder { color: var(--text-tertiary); }
      .field-input:hover { border-color: rgba(66, 106, 210, 0.30); }
      .field-input:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px var(--outline-blue);
        outline: none;
      }

      /* 主按钮：hover 提亮 + 上移 + 图标右滑；active 回落；focus-visible 主蓝环 */
      .btn-primary:hover { background: var(--color-primary-600) !important; transform: translateY(-1px); }
      .btn-primary:hover .btn-ico { transform: translateX(3px); }
      .btn-primary:active { background: var(--color-primary-700) !important; transform: translateY(0); }
      .btn-primary:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
      .btn-ico { transition: transform .16s cubic-bezier(.2,.8,.2,1); }

      /* 文字链接 */
      .link-primary:hover { color: var(--color-primary-700); text-decoration: underline; text-underline-offset: 3px; }
      .link-primary:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; border-radius: 4px; }

      /* 雷达扫描光环：监控业务微交互 */
      .radar-ping { animation: radar-ping 2.6s ease-out infinite; }
      @keyframes radar-ping {
        0%   { transform: scale(.62); opacity: .5; }
        70%  { opacity: 0; }
        100% { transform: scale(1.45); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .radar-ping { animation: none; }
        .btn-primary, .btn-ico, .field-input, .link-primary { transition-duration: .01ms; }
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
