<!--
  ============================================================================
  STZB Watcher · 项目外壳共享片段 (project-shell)
  ----------------------------------------------------------------------------
  用法：本文件是「片段」，不是完整页面。请将下方三部分整体复制到目标页面：
    1) <style> 块         —— 导航条 + 页脚样式（class 均以 site- 前缀，避免冲突）
    2) <header class="site-nav"> —— 全宽粘性导航条，粘贴在 <body> 开头
    3) <footer class="site-footer"> —— 全宽页脚，粘贴在 </body> 之前
  依赖品牌 CSS：../colors_and_type.css（相对 pages/ 目录，由各页面自行引入）。
  所有颜色/字体/圆角均取自品牌 token（var(--*)），片段内不裸写 hex。
  导航链接均带 data-dom-id 供跨页跳转；href 指向同级页面相对路径。
  ============================================================================
-->

<style>
  /* ---------- Top Navigation ---------- */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    width: 100%;
    background: rgba(5, 8, 16, 0.82);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid var(--border);
  }
  .site-nav__inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 12px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  /* ---- Brand seal + name ---- */
  .site-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    border-radius: var(--radius-md);
    outline: none;
    flex-shrink: 0;
  }
  .site-seal {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: var(--radius-sm);
    background: linear-gradient(150deg, var(--color-primary-hi), var(--color-primary-500));
    box-shadow: inset 0 0 0 1px rgba(11, 15, 24, 0.35), var(--glow-gold);
    position: relative;
  }
  .site-seal::after {
    /* carved inner frame — seal-stone feel */
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(11, 15, 24, 0.45);
    border-radius: 2px;
    pointer-events: none;
  }
  .site-seal__char {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 24px;
    line-height: 1;
    color: var(--on-accent);
    position: relative;
    z-index: 1;
    user-select: none;
  }
  .site-brand__text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .site-brand__name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    line-height: 1.1;
    letter-spacing: 0.01em;
    background: linear-gradient(120deg, var(--color-primary-hi), var(--color-primary), var(--color-primary-600));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
  }
  .site-brand__sub {
    font-family: var(--font-body);
    font-size: 12px;
    line-height: 1.2;
    color: var(--text-2);
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- Right side: links + cta ---- */
  .site-nav__right {
    display: flex;
    align-items: center;
    gap: 28px;
    min-width: 0;
  }
  .site-nav__links {
    display: flex;
    align-items: center;
    gap: 28px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .site-nav__link {
    position: relative;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 500;
    color: var(--text-2);
    text-decoration: none;
    padding: 6px 2px;
    cursor: pointer;
    white-space: nowrap;
    transition: color var(--dur) var(--ease);
    outline: none;
  }
  .site-nav__link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -2px;
    height: 2px;
    width: 100%;
    background: linear-gradient(90deg, var(--color-primary), var(--color-primary-hi));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--dur) var(--ease);
  }
  .site-nav__link:hover,
  .site-nav__link:focus-visible {
    color: var(--color-primary-hi);
  }
  .site-nav__link:hover::after,
  .site-nav__link:focus-visible::after {
    transform: scaleX(1);
  }

  /* ---- Primary CTA ---- */
  .site-btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    color: var(--on-accent);
    text-decoration: none;
    padding: 10px 20px;
    border-radius: var(--radius-md);
    background: linear-gradient(120deg, var(--color-primary-hi), var(--color-primary));
    border: 1px solid var(--color-primary-300);
    cursor: pointer;
    white-space: nowrap;
    transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    outline: none;
  }
  .site-btn-primary:hover,
  .site-btn-primary:focus-visible {
    transform: translateY(-1px);
    box-shadow: var(--glow-gold);
  }
  .site-btn-primary:active { transform: translateY(0); }
  .site-btn-primary__icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    transition: transform var(--dur) var(--ease);
  }
  .site-btn-primary:hover .site-btn-primary__icon,
  .site-btn-primary:focus-visible .site-btn-primary__icon {
    transform: translateX(3px);
  }

  /* ---------- Footer ---------- */
  .site-footer {
    width: 100%;
    background: var(--surface);
    border-top: 1px solid transparent;
    position: relative;
  }
  .site-footer__rule {
    height: 1px;
    width: 100%;
    background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
    border: 0;
    margin: 0;
  }
  .site-footer__inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 56px 32px 40px;
    display: grid;
    grid-template-columns: 1.6fr 1fr 1.2fr;
    gap: 48px;
  }
  .site-footer__col-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    color: var(--color-primary);
    letter-spacing: 0.08em;
    margin: 0 0 18px;
  }
  /* brand column */
  .site-footer__brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    margin-bottom: 16px;
  }
  .site-footer__brand-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
    color: var(--color-primary-hi);
    white-space: nowrap;
  }
  .site-footer__desc {
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-2);
    margin: 0;
    max-width: 42ch;
  }
  /* quick links */
  .site-footer__links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .site-footer__link {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-2);
    text-decoration: none;
    cursor: pointer;
    transition: color var(--dur) var(--ease);
    width: fit-content;
    outline: none;
  }
  .site-footer__link:hover,
  .site-footer__link:focus-visible { color: var(--color-primary-hi); }
  /* contact */
  .site-footer__contact {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .site-footer__contact-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.6;
  }
  .site-footer__contact-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--color-primary);
    margin-top: 2px;
  }
  .site-footer__qq {
    font-family: var(--font-mono);
    color: var(--text);
    letter-spacing: 0.03em;
  }
  .site-footer__bottom {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px 32px 32px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  /* ---------- Focus ring (accessibility) ---------- */
  .site-brand:focus-visible,
  .site-nav__link:focus-visible,
  .site-btn-primary:focus-visible,
  .site-footer__link:focus-visible,
  .site-footer__brand:focus-visible {
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--color-primary);
    border-radius: var(--radius-sm);
  }

  /* ---------- Responsive: tablet ---------- */
  @media (max-width: 1024px) {
    .site-nav__inner,
    .site-footer__inner,
    .site-footer__bottom { padding-left: 24px; padding-right: 24px; }
    .site-nav__right { gap: 20px; }
    .site-nav__links { gap: 20px; }
    .site-footer__inner { grid-template-columns: 1fr 1fr; gap: 36px; }
  }

  /* ---------- Responsive: mobile (< 768px) ---------- */
  @media (max-width: 767px) {
    .site-nav__inner {
      flex-wrap: wrap;
      row-gap: 12px;
      padding: 10px 16px;
    }
    .site-brand__sub { display: none; }        /* simplify: drop subtitle on narrow */
    .site-nav__right {
      width: 100%;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px 16px;
    }
    .site-nav__links {
      flex-wrap: wrap;                          /* wrap, never horizontal scroll */
      gap: 10px 18px;
      order: 2;
    }
    .site-btn-primary { order: 1; margin-left: auto; }
    .site-footer__inner {
      grid-template-columns: 1fr;
      gap: 32px;
      padding: 40px 16px 32px;
    }
    .site-footer__bottom {
      padding: 16px 16px 28px;
      justify-content: center;
      text-align: center;
    }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .site-nav__link,
    .site-nav__link::after,
    .site-btn-primary,
    .site-btn-primary__icon,
    .site-footer__link { transition-duration: 0.01ms; }
  }
</style>
