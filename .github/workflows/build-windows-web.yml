name: Build Windows Web EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签，例如 v1.0.0-web'
        required: true
        default: 'v1.0.0-web'
        type: string
      publish_release:
        description: '构建成功后发布到 GitHub Releases'
        required: true
        default: false
        type: boolean
  push:
    paths:
      - 'run_web_exe.py'
      - 'api_server.py'
      - 'realtime_writer.py'
      - 'static/**'
      - 'packaging/pyinstaller/**'
      - 'packaging/scripts/build_web_exe.ps1'
      - '.github/workflows/build-windows-web.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packaging/pyinstaller/requirements-build.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r packaging/pyinstaller/requirements-build.txt
      - name: Build Web EXE
        shell: pwsh
        run: .\packaging\scripts\build_web_exe.ps1
      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = 'dist/STZB助手-Web.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: STZB-Web-Windows
          path: dist/STZB助手-Web.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: STZB Web ${{ inputs.release_tag }}
          generate_release_notes: true
          files: dist/STZB助手-Web.exe
